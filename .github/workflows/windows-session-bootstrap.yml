name: Windows Session Bootstrap

on:
  push:
    branches:
      - test/windows-session-bootstrap-ci

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'decode2/gentle-pi'
    runs-on: windows-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Run Windows session bootstrap tests
        shell: cmd
        run: node --experimental-strip-types --test --test-name-pattern="Windows bootstrap startup control" tests/windows-session-bootstrap.test.ts
