name: Windows Session Bootstrap

on:
  push:
    branches:
      - test/windows-session-bootstrap-ci

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'decode2/gentle-pi'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      npm_config_ignore_scripts: "true"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Setup pnpm
        if: runner.environment == 'github-hosted'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        env:
          npm_config_store_dir: ${{ runner.temp }}/pnpm-store
        with:
          version: 11.1.1
          dest: ${{ runner.temp }}/setup-pnpm
      - name: Install pinned dependencies without lifecycle scripts (Windows)
        id: install_windows_dependencies
        if: matrix.platform == 'windows' && runner.environment == 'github-hosted'
        shell: pwsh
        run: pnpm install --frozen-lockfile --ignore-scripts --store-dir "$env:RUNNER_TEMP\pnpm-store"
      - name: Install pinned dependencies without lifecycle scripts (Unix)
        id: install_unix_dependencies
        if: matrix.platform != 'windows' && runner.environment == 'github-hosted'
        shell: bash
        run: pnpm install --frozen-lockfile --ignore-scripts --store-dir "$RUNNER_TEMP/pnpm-store"
      - name: Run Windows bootstrap startup control
        if: matrix.platform == 'windows'
        shell: cmd
        run: node --experimental-strip-types --test --test-name-pattern="^Windows bootstrap startup control$" tests/windows-session-bootstrap.test.ts
      - name: Run Windows profile bootstrap acceptance
        if: matrix.platform == 'windows'
        shell: cmd
        run: node --experimental-strip-types --test --test-name-pattern="^Windows-native " tests/windows-session-bootstrap.test.ts
      - name: Run extension and portable Windows transport tests (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: node --experimental-strip-types --test tests/gentle-agents.test.ts tests/windows-session-compile.test.ts tests/windows-session-transport.test.ts
      - name: Run extension and portable Windows transport tests (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: node --experimental-strip-types --test tests/gentle-agents.test.ts tests/windows-session-compile.test.ts tests/windows-session-transport.test.ts
      - name: Run AgentRunner permission FD3 platform matrix (Windows)
        if: matrix.platform == 'windows'
        shell: cmd
        run: node --experimental-strip-types --test --test-name-pattern="^AgentRunner (platform matrix scopes permission fd3 transport|primary IPC cleanup respects native connection state)$" tests/agents-runner.test.ts
      - name: Run AgentRunner permission FD3 platform matrix (Unix)
        if: matrix.platform != 'windows'
        shell: bash
        run: node --experimental-strip-types --test --test-name-pattern="^AgentRunner (platform matrix scopes permission fd3 transport|primary IPC cleanup respects native connection state)$" tests/agents-runner.test.ts
      - name: Run standing permission IPC boundary test (Windows)
        if: "!cancelled() && matrix.platform == 'windows' && steps.install_windows_dependencies.outcome == 'success'"
        shell: pwsh
        run: node --experimental-strip-types --test tests/review-session-standing-permission-ipc.test.ts
      - name: Run POSIX session transport tests
        if: matrix.platform != 'windows'
        shell: bash
        run: node --experimental-strip-types --test tests/agents-session-transport.test.ts tests/agents-session-transport-process.test.ts
      - name: Prove packed unhooked imports and default registrations (Windows)
        if: "!cancelled() && matrix.platform == 'windows' && steps.install_windows_dependencies.outcome == 'success'"
        shell: cmd
        run: node scripts\test-packed-runner.mjs --unhooked-imports
      - name: Prove packed unhooked imports and default registrations (Unix)
        if: "!cancelled() && matrix.platform != 'windows' && steps.install_unix_dependencies.outcome == 'success'"
        shell: bash
        run: node scripts/test-packed-runner.mjs --unhooked-imports
