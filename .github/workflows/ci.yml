name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          GENTLE_PI_REQUIRE_NATIVE_BINARY: "1"

      - name: Verify generated runtime modules
        run: pnpm run check:runtime-modules

      - name: Verify package contents
        run: node scripts/verify-package-files.mjs

      - name: Verify packed installation
        run: pnpm run test:packed-package

  verify-windows:
    # Windows is a documented target (the native runtime is built from the
    # exact v2.4.0 source tag via Go SumDB) but was never exercised by CI.
    # The suite must be green on Windows: tests exercising POSIX-only
    # semantics (symlinks, executable mode, Darwin/Linux bundles) skip via
    # platform guards, and the failure classes this job exists for (git-config
    # leakage, CRLF pollution, mode/symlink semantics) were fixed in
    # openspec/changes/harness-audit-test-infra.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: "pnpm"

      # The Windows native binary is built from source and requires a local Go
      # toolchain (GOTOOLCHAIN=local; the installer never downloads Go).
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ">=1.25.10"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test
        env:
          GENTLE_PI_REQUIRE_NATIVE_BINARY: "1"

      - name: Verify generated runtime modules
        run: pnpm run check:runtime-modules

      - name: Verify package contents
        run: node scripts/verify-package-files.mjs